<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Оформление сделки Nurzaman</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Оформление сделки — Nurzaman</h1>
  </header>

  <main class="layout">
    <section class="card">
      <h2>Новая заявка</h2>
      <form id="dealForm" novalidate>
        <label class="field">
          <span>Ф.И.О. клиента *</span>
          <input type="text" name="fullName" id="fullName" required />
        </label>

        <label class="field">
          <span>Телефон</span>
          <input type="tel" name="phone" id="phone" placeholder="+996 ..." />
        </label>

        <div class="scan-block">
          <label class="field">
            <span>Фото паспорта / ID-карты</span>
            <input type="file" accept="image/*" capture="environment" id="idPhotoInput" />
          </label>
          <button type="button" id="scanBtn" disabled>Распознать документ</button>
          <span id="scanStatus" class="scan-status" aria-live="polite"></span>
        </div>

        <label class="field" id="docNumberField">
          <span>Паспорт / ID №</span>
          <input type="text" name="docNumber" id="docNumber" />
          <small class="hint" id="docNumberHint" hidden>Распознано автоматически — проверьте</small>
        </label>

        <label class="field" id="pinField">
          <span>ИНН (ПИН)</span>
          <input type="text" name="pin" id="pin" inputmode="numeric" maxlength="14" />
          <small class="hint" id="pinHint" hidden>Распознано автоматически — проверьте</small>
        </label>

        <label class="checkbox" id="photoConsentRow" hidden>
          <input type="checkbox" id="photoConsent" name="photoConsent" />
          <span>Клиент согласен на обработку фото документа для целей распознавания данных заявки</span>
        </label>

        <label class="field">
          <span>Примечания</span>
          <textarea name="notes" id="notes" rows="2"></textarea>
        </label>

        <label class="checkbox">
          <input type="checkbox" id="agreementConsent" name="agreementConsent" />
          <span>Клиент согласен с условиями приобретения</span>
        </label>

        <button type="submit" class="primary">Сохранить заявку</button>
        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Список заявок</h2>
        <a href="/api/deals/export" class="export-link">Экспорт в Excel</a>
      </div>
      <table id="dealsTable">
        <thead>
          <tr>
            <th>Дата</th>
            <th>Ф.И.О.</th>
            <th>ID №</th>
            <th>ПИН</th>
            <th>Проверено</th>
          </tr>
        </thead>
        <tbody id="dealsTableBody"></tbody>
      </table>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
