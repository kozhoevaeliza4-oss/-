# Настройки для render.com: приложение «Задачи руководителя» (папка tasks-app).
# Render → New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: boss-tasks
    runtime: node
    rootDir: tasks-app
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Bishkek
      - key: REMINDER_MINUTES
        value: "30"
      - key: DATA_FILE
        value: /var/data/db.json
      - key: TRUST_PROXY
        value: "1"
      # PIN-коды Render спросит при создании — придумайте свои.
      - key: ASSISTANT_PIN
        sync: false
      - key: BOSS_PIN
        sync: false
    # Постоянный диск: задачи и ключи уведомлений не пропадут при перезапуске.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
